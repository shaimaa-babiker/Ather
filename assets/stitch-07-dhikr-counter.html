<!-- BEGIN: CounterInteractivityScript -->
<script data-purpose="counter-logic">
  // Counter state
  let count = 1;
  const maxCount = 3;
  const radius = 42;
  const circumference = 2 * Math.PI * radius; // ~263.89

  const countDisplay = document.getElementById('currentCount');
  const progressRing = document.getElementById('progressRing');
  const counterBtn = document.getElementById('counterButton');
  const completeBtn = document.getElementById('btnComplete');

  function updateProgress() {
    countDisplay.textContent = count;
    const offset = circumference - (count / maxCount) * circumference;
    progressRing.style.strokeDashoffset = offset;
  }

  // Tap counter button to increment
  counterBtn.addEventListener('click', () => {
    if (count < maxCount) {
      count++;
    } else {
      count = 1;
    }
    updateProgress();
  });

  // Complete button
  completeBtn.addEventListener('click', () => {
    count = maxCount;
    updateProgress();
  });

  // Initial setup
  updateProgress();
</script>
<!-- END: CounterInteractivityScript -->
